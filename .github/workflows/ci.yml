name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-verify:
    name: PC build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          gcc --version | head -1
          make --version | head -1
          gcov --version | head -1

      - name: make
        working-directory: dump_pcm_data
        run: make

      # Runs the four contract scripts plus the full test binary.
      - name: make run
        working-directory: dump_pcm_data
        run: make run

      - name: make coverage
        working-directory: dump_pcm_data
        run: make coverage

      # Verifies the CMake target, including the desktop observe opt-in and the
      # test target CTest registers.
      - name: CMake static library and test target
        working-directory: dump_pcm_data
        run: |
          cmake -S . -B build/cmake -DDUMP_PCM_DESKTOP_OBSERVE=ON -DDUMP_PCM_BUILD_TESTS=ON
          cmake --build build/cmake
          ctest --test-dir build/cmake --output-on-failure

      # The suite is supposed to be optimization-independent. It was not: at -O2
      # gcc treats malloc/calloc/realloc as builtins, which reorders the calls
      # the allocator fault-injection cases count. -fno-builtin-* fixes that and
      # this step keeps the flags from being dropped.
      - name: Test target at -O2
        working-directory: dump_pcm_data
        run: |
          cmake -S . -B build/cmake-o2 -DDUMP_PCM_BUILD_TESTS=ON -DCMAKE_C_FLAGS=-O2
          cmake --build build/cmake-o2
          ctest --test-dir build/cmake-o2 --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    # The suite already asserts behaviour; this asserts that reaching that
    # behaviour does not read freed memory, overflow a buffer or rely on
    # undefined arithmetic. Linux only: MinGW has no working ASan.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: gcc --version | head -1

      - name: Build and run the suite under ASan and UBSan
        working-directory: dump_pcm_data
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/san -DDUMP_PCM_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/san
          ctest --test-dir build/san --output-on-failure

  mingw-compile:
    name: MinGW cross compile check
    # Same assertion as before - the module compiles for Windows with MinGW on
    # a bare command line, no harness, no link step - but on a runner that
    # already has the compiler. The job used to apt-install a cross toolchain
    # onto ubuntu-latest, and the install step sat for over half an hour on
    # three consecutive runners without finishing. The public header staying
    # free of POSIX-only includes is what this gate protects; the host OS of
    # the compiler was never part of the assertion.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: dump_pcm_data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: gcc -dumpversion

      # Compile only: no --wrap/coverage flags, no test harness, no link step.
      - name: Compile module sources for Windows
        run: |
          mkdir -p build/mingw
          for f in src/*.c; do
            echo "--- $f"
            gcc -std=c11 -Wall -Wextra -Iinclude -Isrc \
              -DDUMP_PCM_PC -D_POSIX_C_SOURCE=200809L \
              -c "$f" -o "build/mingw/$(basename "$f" .c).o"
          done

  windows-full-suite:
    name: Windows native full suite
    runs-on: windows-latest
    # The image ships MinGW-w64 15.2.0 in C:\mingw64\bin and already puts it on
    # PATH; its MSYS2 install is an empty shell, so do not route through it.
    # `shell: bash` resolves to Git for Windows bash, which the harness scripts
    # need. This is the job that actually runs the whole suite on Windows rather
    # than merely compiling them.
    defaults:
      run:
        shell: bash
        working-directory: dump_pcm_data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        # No pipes here: `shell: bash` implies -o pipefail, and SIGPIPE from a
        # short-circuiting head(1) would fail the step for no reason.
        run: |
          gcc -dumpversion
          bash --version | sed -n 1p
          command -v cygpath || echo "cygpath not on PATH"

      - name: Run the full suite
        env:
          MINGW_BIN: /c/mingw64/bin
        run: |
          # cygpath lives in Git\usr\bin, which the image does not put on PATH.
          # Prepending it keeps the runner on the deterministic path branch.
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          sh test/run_full_windows.sh

      # The fixture latch is only worth having if something checks it. A root
      # that cannot be created must turn most of the suite red; if it ever goes
      # green, reset_test_dir() and pass() stopped talking to each other and
      # every case in the suite can report PASS without observing anything.
      #
      # Same binary as the run above, so this costs no rebuild. It is slow on
      # purpose: with an unusable root most cases walk their retry/backoff
      # paths, which is exactly the behaviour being asserted.
      - name: Negative control - an unusable root must fail the suite
        timeout-minutes: 6
        run: |
          mkdir -p build/negctl
          : > build/negctl/blocker
          root="$(cygpath -m "$(pwd)/build/negctl")"

          set +e
          AUDIO_DUMP_ENABLED=1 AUDIO_DUMP_DIR="$root/blocker/sub" \
            build/winfull/dump_pcm_test.exe > build/negctl/out.log 2>&1
          rc=$?
          set -e

          fails=$(grep -c '^FAIL:' build/negctl/out.log || true)
          passes=$(grep -c '^PASS:' build/negctl/out.log || true)
          printf 'exit=%s fails=%s passes=%s\n' "$rc" "$fails" "$passes"

          if [ "$rc" -eq 0 ]; then
            echo "::error::the suite passed against an unusable root - the fixture latch regressed"
            exit 1
          fi
          if [ "$fails" -lt 40 ]; then
            echo "::error::only $fails cases failed; the suite died early instead of asserting"
            exit 1
          fi

      - name: Build and run through CMake
        env:
          MINGW_BIN: /c/mingw64/bin
        run: |
          cmake -S . -B build/win-cmake -G "MinGW Makefiles" -DDUMP_PCM_BUILD_TESTS=ON
          cmake --build build/win-cmake
          ctest --test-dir build/win-cmake --output-on-failure

      - name: Collect failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-suite-logs
          path: |
            dump_pcm_data/build/winfull/**
            dump_pcm_data/build/win-cmake/CMakeFiles/CMakeOutput.log
            dump_pcm_data/build/win-cmake/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7
